name: Archive storytold source code

# Archivage du CODE SOURCE (pas des binaires) des dépôts officiels `storytold`.
# Objectif : pouvoir restaurer un dépôt entier même si l'amont disparaît.
#
# Méthode : `git clone --mirror` puis `git bundle create --all`.
# Le bundle contient TOUTES les refs (branches + tags), donc tout l'historique,
# dans un seul fichier vérifiable par SHA-256 et restaurable en une commande.
#
# Déclencheurs : lundi 02:00 UTC + lancement manuel.

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps séparées par des virgules, ou 'all'"
        required: false
        default: "all"
      keep:
        description: "Nombre de bundles conservés par app"
        required: false
        default: "3"
      force:
        description: "Recréer même si rien n'a changé"
        type: boolean
        required: false
        default: false

concurrency:
  group: archive-source
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_ORG: storytold
  DEFAULT_APPS: >-
    craft-launcher photocraft vectorcraft pdfcraft cadcraft deckcraft gridcraft
    wordcraft lightcraft filmcraft figcraft effectcraft designcraft materialcraft
    texturecraft soundcraft anicraft craft-anything craft-libs craft-fonts
    craft-i18n craft-launcher-assets

jobs:
  # --------------------------------------------------------------------------
  # 1. Découverte : HEAD de la branche par défaut de chaque dépôt
  # --------------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - name: Matrice des dépôts
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_APPS: ${{ inputs.apps || 'all' }}
        run: |
          set -euo pipefail
          if [ "$INPUT_APPS" = "all" ]; then
            apps="$DEFAULT_APPS"
          else
            apps="$(echo "$INPUT_APPS" | tr ',' ' ')"
          fi
          json="[]"
          for app in $apps; do
            if ! gh api "repos/$UPSTREAM_ORG/$app" > meta.json 2>/dev/null; then
              echo "::warning::$app introuvable en amont — ignoré"
              continue
            fi
            branch="$(jq -r '.default_branch' meta.json)"
            sha="$(jq -r '.size' meta.json >/dev/null; gh api "repos/$UPSTREAM_ORG/$app/commits/$branch" --jq '.sha')"
            mb=$(( $(jq -r '.size' meta.json) / 1024 ))
            echo "$app → $branch @ ${sha:0:7} (${mb} Mo)"
            json="$(jq -c --arg a "$app" --arg b "$branch" --arg s "$sha" \
              '. + [{app:$a, branch:$b, sha:$s}]' <<< "$json")"
          done
          echo "matrix={\"include\":$(jq -c . <<< "$json")}" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<< "$json")" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # 2. Archivage : un job par dépôt
  # --------------------------------------------------------------------------
  archive:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Bundle de ${{ matrix.app }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ matrix.app }}
          SHA: ${{ matrix.sha }}
          BRANCH: ${{ matrix.branch }}
          KEEP: ${{ inputs.keep || '3' }}
          FORCE: ${{ inputs.force || 'false' }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHORT="${SHA:0:7}"
          TAG="source/${APP}/${SHORT}"

          if gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            if [ "$FORCE" != "true" ]; then
              echo "Déjà archivé : $TAG — rien à faire."
              exit 0
            fi
            gh release delete "$TAG" --repo "$TARGET_REPO" --yes --cleanup-tag || true
          fi

          # Clone miroir : toutes les refs, historique complet, blobs inclus.
          echo "clone --mirror de $UPSTREAM_ORG/$APP"
          git clone --quiet --mirror "https://github.com/$UPSTREAM_ORG/$APP.git" repo.git
          cd repo.git

          # Inventaire des refs : preuve de ce qui est archivé.
          git for-each-ref --format='%(refname) %(objectname)' > ../refs.txt
          NB_REFS=$(wc -l < ../refs.txt)
          NB_BRANCHES=$(grep -c '^refs/heads/' ../refs.txt || true)
          NB_TAGS=$(grep -c '^refs/tags/' ../refs.txt || true)
          echo "$NB_REFS refs : $NB_BRANCHES branches, $NB_TAGS tags"

          # Bundle autonome, toutes refs, avec la ref de tête comme point d'entrée.
          BUNDLE="$PWD/../${APP}-${SHORT}.bundle"
          git bundle create "$BUNDLE" --all "HEAD"

          # `git bundle verify` exige un dépôt : on le lance depuis le miroir.
          git bundle verify "$BUNDLE" | tail -3
          cd ..
          BUNDLE_SHA=$(sha256sum "$BUNDLE" | cut -d' ' -f1)
          BUNDLE_MB=$(du -m "$BUNDLE" | cut -f1)
          echo "bundle : ${BUNDLE_MB} Mo, sha256 ${BUNDLE_SHA:0:16}…"

          # Manifeste : ce qui a été archivé et comment le restaurer.
          cat > MANIFEST.json <<JSON
          {
            "upstream": "https://github.com/$UPSTREAM_ORG/$APP",
            "upstream_default_branch": "$BRANCH",
            "upstream_head": "$SHA",
            "archived_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run": "$GITHUB_SERVER_URL/$TARGET_REPO/actions/runs/$GITHUB_RUN_ID",
            "refs_total": $NB_REFS,
            "branches": $NB_BRANCHES,
            "tags": $NB_TAGS,
            "bundle": "$(basename "$BUNDLE")",
            "bundle_bytes": $(stat -c %s "$BUNDLE"),
            "bundle_sha256": "$BUNDLE_SHA",
            "restore": [
              "git clone $(basename "$BUNDLE") $APP",
              "cd $APP && git remote set-url origin https://github.com/<vous>/$APP.git",
              "git push --mirror origin   # recrée branches et tags"
            ]
          }
          JSON

          gh release create "$TAG" "$BUNDLE" MANIFEST.json refs.txt \
            --repo "$TARGET_REPO" \
            --title "$APP @ $SHORT (code source complet)" \
            --notes "Archive du dépôt github.com/$UPSTREAM_ORG/$APP à $SHORT.
          Bundle git : toutes les branches et tags, historique complet.
          Restauration : \`git clone <bundle>\` puis \`git push --mirror\` vers un dépôt vide.
          SHA-256 du bundle : \`$BUNDLE_SHA\`"

          # Rétention : ne garder que les KEEP archives les plus récentes de cette app.
          if [ "$KEEP" -gt 0 ]; then
            gh api "repos/$TARGET_REPO/releases?per_page=100" --paginate \
              --jq "[.[] | select(.tag_name | startswith(\"source/$APP/\"))] | sort_by(.created_at) | reverse | .[$KEEP:] | .[].tag_name" \
              | while read -r old; do
                  [ -n "$old" ] || continue
                  echo "purge $old"
                  gh release delete "$old" --repo "$TARGET_REPO" --yes --cleanup-tag || true
                done
          fi

  # --------------------------------------------------------------------------
  # 3. Index + keepalive
  # --------------------------------------------------------------------------
  index:
    needs: [discover, archive]
    if: always() && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Régénérer source-index.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq '[.[] | select(.tag_name | startswith("source/"))
                   | {tag: .tag_name,
                      app: (.tag_name | split("/")[1]),
                      upstream_head: (.tag_name | split("/")[2]),
                      archived_at: .created_at,
                      bundle: ([.assets[] | select(.name | endswith(".bundle")) | {name, size, url: .browser_download_url}][0])}]' \
            | jq -s 'add // [] | sort_by(.archived_at) | reverse' > source-index.json
          echo "source-index.json : $(jq length source-index.json) archive(s)"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-index.json
          if git diff --cached --quiet; then
            date -u > .keepalive
            git add .keepalive
          fi
          git commit -m "chore: index source $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || echo "::warning::rien à pousser"

      - name: Résumé
        run: |
          {
            echo "## Archive du code source"
            echo ""
            echo "| App | HEAD archivé | Bundle |"
            echo "|---|---|---|"
            jq -r '.[] | "| \(.app) | \(.upstream_head) | \(.bundle.name // "—") (\(((.bundle.size // 0)/1048576*10|floor)/10) Mo) |"' source-index.json
          } >> "$GITHUB_STEP_SUMMARY"
